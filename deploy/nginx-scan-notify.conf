# nginx — Finger Scan Notify บน dashboard-srv
# คัดลอกไป /etc/nginx/conf.d/scan-notify.conf แล้ว: sudo nginx -t && sudo systemctl reload nginx
# 1 ชื่อเครื่องต่อ 1 ระบบ (เหมือน ipd-overview, ipd-food) — ห้ามใส่ IP หรือ default_server เพราะเครื่องนี้มีระบบอื่น
# nginx ใช้ร่วมกับระบบอื่น: ใช้ reload เท่านั้น ห้าม restart
#
# HTTP (พอร์ต 80) ในวง VLAN ภายในเท่านั้น เหมือนระบบอื่นบนเครื่อง
# ถ้าภายหลังเปลี่ยนเป็น HTTPS: เพิ่ม listen 443 ssl + cert + redirect 80 → 443 (แอปอ่าน X-Forwarded-Proto อยู่แล้ว)
#
# แอปไม่มีไฟล์ static บนดิสก์ให้ nginx เสิร์ฟ ทุกคำขอส่งต่อไป waitress (127.0.0.1:5050) ซึ่งตอบ 404 สำหรับ path ที่ไม่มี
# กฎ deny ด้านล่างเป็นด่านที่สอง ทดสอบหลัง deploy ทุกครั้งด้วย deploy/smoke_after_deploy.sh

server {
    listen 80;
    server_name scan-notify.ckhospital.local;

    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(db|sqlite|db-journal|db-wal|env|py|pyc|sh|log|bak|md|conf|cron|service|txt)$ { deny all; }

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        # เขียนทับ (ไม่ต่อท้าย) — browser ปลอม X-Forwarded-For เพื่อหลบการล็อกรหัสผิดไม่ได้
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_read_timeout 120;   # ตรวจสถานะส่งย้อนหลังช่วงยาวถาม hosoffice ทีเดียวหลายวัน
    }
}
