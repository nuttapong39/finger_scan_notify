{# ฟอร์มเปลี่ยนรหัส — ใช้ทั้งในหน้าเปลี่ยนรหัสและใน pop-up บังคับเปลี่ยน (base.html) #}
<form class="password-form" autocomplete="off" onsubmit="return submitPasswordForm(event)">
  <div class="form-group">
    <label class="form-label">รหัสผ่านปัจจุบัน{% if must_change_password %} (รหัสชั่วคราว){% endif %}</label>
    <input type="password" name="current" class="form-control" autocomplete="current-password" required>
  </div>
  <div class="form-group">
    <label class="form-label">รหัสผ่านใหม่ (อย่างน้อย 10 ตัวอักษร)</label>
    <input type="password" name="new" class="form-control" minlength="10" autocomplete="new-password" required>
  </div>
  <div class="form-group">
    <label class="form-label">ยืนยันรหัสผ่านใหม่</label>
    <input type="password" name="confirm" class="form-control" minlength="10" autocomplete="new-password" required>
  </div>
  <div class="password-msg" role="alert" style="display:none; margin-bottom:12px;"></div>
  <button type="submit" class="btn btn-primary">{{ icon('save') }} เปลี่ยนรหัสผ่าน</button>
</form>
