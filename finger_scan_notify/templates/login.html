<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — Finger Scan Notify</title>
{% include "_head_assets.html" %}
<style>
body { display:flex; align-items:center; justify-content:center; padding:16px; }
.login-corner { position:fixed; top:16px; right:16px; }
.login-card { width:100%; max-width:360px; background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:32px 28px; }
.brand { text-align:center; margin-bottom:22px; }
.brand img { width:64px; height:64px; border-radius:14px; }
.brand .hosp { font-size:13px; color:var(--text-muted); margin-top:10px; }
.brand h1 { font-size:20px; margin-top:2px; }
.login-card .btn { width:100%; margin-top:20px; padding:10px; font-size:15px; }
.login-card .alert { margin:16px 0 0; }
.hint { margin-top:18px; font-size:12px; color:var(--text-muted); text-align:center; line-height:1.6; }
</style>
</head>
<body>
<div class="login-corner">{% include "_appearance_toggle.html" %}</div>
<form class="login-card" method="POST" action="/login" autocomplete="off">
  <div class="brand">
    <img src="{{ static_url('logo_ck.png') }}" alt="ตราโรงพยาบาลเชียงกลาง" width="64" height="64">
    <div class="hosp">โรงพยาบาลเชียงกลาง</div>
    <h1>Finger Scan Notify</h1>
  </div>
  <input type="hidden" name="next" value="{{ next or '' }}">
  <div class="form-group">
    <label class="form-label" for="username">บัญชี</label>
    <input class="form-control" id="username" name="username" value="admin" autocomplete="username" required>
  </div>
  <div class="form-group" style="margin-bottom:0;">
    <label class="form-label" for="password">รหัสผ่าน</label>
    <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  </div>
  {% if error %}<div class="alert alert-error" role="alert">{{ icon('circle-x') }} <span>{{ error }}</span></div>{% endif %}
  <button type="submit" class="btn btn-primary">{{ icon('log-in') }} เข้าสู่ระบบ</button>
  <div class="hint">ลืมรหัส: ผู้ดูแล Server รัน <code>manage.py reset-admin</code></div>
</form>
</body>
</html>
